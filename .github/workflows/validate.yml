name: Validate blog

# This workflow is the merge gate. Do not add a schedule trigger to it. GitHub
# disables a scheduled workflow after 60 days without repository activity, and
# the disabled workflow then also stops running for pull requests and pushes.
# The scheduled checks are in weekly-checks.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm audit --omit=dev
